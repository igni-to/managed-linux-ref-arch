---
# Point sshd at the certificate authority.
#
# The ordering hazard here is the same one the breakglass role exists for, in
# a smaller form: this role can make a host unreachable over SSH. It is
# therefore written so that every dangerous change is either verified first or
# gated behind a variable that defaults to the safe setting.

- name: Refuse to run without the CA public key
  ansible.builtin.assert:
    that: ssh_user_ca_public_key | length > 0
    fail_msg: >-
      ssh_user_ca_public_key is empty. During a full site run it is gathered
      from the CA host by the ssh_ca role; when running this role alone, pass
      it explicitly. Writing an empty TrustedUserCAKeys file would leave sshd
      refusing every certificate.

- name: Confirm the host has an escape hatch
  ansible.builtin.stat:
    path: /etc/breakglass-account
  register: sshca_breakglass

- name: Assert break-glass is present before changing how SSH authenticates
  ansible.builtin.assert:
    that: sshca_breakglass.stat.exists
    fail_msg: >-
      This host has no break-glass account. Changing SSH authentication
      without one means a mistake in this role is unrecoverable over the
      network. Run the breakglass role first.

- name: Install the trusted CA key
  ansible.builtin.copy:
    content: "{{ ssh_user_ca_public_key }}\n"
    dest: "{{ ssh_ca_trusted_keys_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart sshd

- name: Resolve which group may log in to this host class
  ansible.builtin.set_fact:
    ssh_ca_host_principal: >-
      {{ ssh_ca_principals[(group_names | intersect(ssh_ca_principals.keys() | list) | first | default(''))]
         | default('') }}

- name: Refuse to configure a host class with no stated principal
  ansible.builtin.assert:
    that: ssh_ca_host_principal | length > 0
    fail_msg: >-
      No entry in ssh_ca_principals covers this host's groups
      ({{ group_names | join(', ') }}). A host class has to say who may reach
      it; defaulting to "everyone" would grant shell access to the whole
      directory by omission.

- name: Map certificate principals onto local accounts
  ansible.builtin.template:
    src: authorized-principals.j2
    dest: /etc/ssh/authorized_principals
    owner: root
    group: root
    mode: "0644"
  notify: restart sshd

- name: Configure sshd
  ansible.builtin.template:
    src: sshd-ca.conf.j2
    dest: /etc/ssh/sshd_config.d/50-certificate-auth.conf
    owner: root
    group: root
    mode: "0644"
    # A bad sshd config that replaces a good one takes the host off the
    # network until somebody walks to it. The daemon validates its own
    # configuration, so there is no reason to find out the hard way.
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd

# Verification before the irreversible step. The handler has not run yet, so
# this checks that the configuration sshd is about to adopt is one it accepts
# in full — not just the fragment above in isolation.
- name: Check the complete configuration sshd will load
  ansible.builtin.command: /usr/sbin/sshd -T
  register: sshd_effective
  changed_when: false

- name: Assert certificate authentication is actually in effect
  ansible.builtin.assert:
    that:
      - "'trustedusercakeys' in sshd_effective.stdout | lower"
    fail_msg: >-
      sshd accepted the configuration but is not reporting TrustedUserCAKeys.
      Certificates would be refused. Not proceeding.
    success_msg: "sshd will accept certificates signed by the estate CA."
