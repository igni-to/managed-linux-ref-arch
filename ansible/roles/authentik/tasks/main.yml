---
# Authentik, deployed so that Terraform can configure it immediately afterward
# with no human in between.
#
# The design decision worth knowing about is the LDAP outpost. Authentik can
# serve LDAP two ways: a separate outpost container, or the outpost embedded in
# the server process. This role uses the embedded one.
#
# The separate container is the more isolated design and it has a bootstrap
# problem: the outpost's API token is generated by Authentik when the outpost
# is created, so the container cannot be configured until after Terraform has
# run, and Terraform cannot run until Authentik is up. That is a two-phase
# deployment with a manual handoff in the middle, which is exactly what this
# architecture is trying not to have.
#
# The cost of the embedded outpost is honest and worth stating: LDAP is served
# by the same process as the web interface, so they fail together and share a
# blast radius. For an estate at this size that is an acceptable trade. For a
# larger one, split it — and accept the two-phase deployment.

- name: Fail early if a required secret is missing
  ansible.builtin.assert:
    that: vars[item] is defined and vars[item] | length > 0
    fail_msg: >-
      {{ item }} is not set. Authentik secrets come from the secret store at
      run time and are never committed. See docs/05-secrets.md.
  loop: "{{ authentik_required_secrets }}"
  no_log: true

- name: Install Docker from the vendor repository
  ansible.builtin.include_tasks: docker.yml

- name: Create the deployment directory
  ansible.builtin.file:
    path: "{{ authentik_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render the environment file
  ansible.builtin.template:
    src: authentik.env.j2
    dest: "{{ authentik_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart authentik

- name: Render the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    # A broken compose file that replaces a working one takes the identity
    # provider down until somebody notices, so it is checked before it lands.
    validate: docker compose -f %s config --quiet
  notify: restart authentik

- name: Start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_dir }}"
    state: present
    pull: missing
  register: authentik_compose

# Terraform runs immediately after this role, and it authenticates against an
# API that returns 502 for a while after the containers report as started.
# Without this wait the failure surfaces as a confusing Terraform error rather
# than as "the service has not finished starting", which is what it is.
- name: Wait for the API to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/-/health/ready/"
    status_code: [200, 204]
  register: authentik_ready
  until: authentik_ready is succeeded
  retries: 60
  delay: 5
  changed_when: false

- name: Report where Terraform should point
  ansible.builtin.debug:
    msg: >-
      Authentik is ready. Configure it with terraform/identity, using
      authentik_url=http://{{ ansible_default_ipv4.address | default('the idp host') }}:{{ authentik_http_port }}
      and the bootstrap token as authentik_token.
