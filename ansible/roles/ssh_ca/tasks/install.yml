---
# step-ca and the step CLI, from the upstream release archives.
#
# Not from distribution packages: neither Debian nor Fedora ships a version
# close enough to current, and a certificate authority is the wrong place to
# run something two years old. The trade is that upgrades are this role's
# problem rather than the package manager's, which is why the version is
# pinned in defaults and moving it is a reviewable commit.

- name: Resolve the release architecture
  ansible.builtin.set_fact:
    step_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

- name: Install step-ca
  ansible.builtin.unarchive:
    src: "https://github.com/smallstep/certificates/releases/download/v{{ step_ca_version }}/step-ca_linux_{{ step_ca_version }}_{{ step_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=0]
    include: [step-ca]
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/step-ca

- name: Install the step CLI
  ansible.builtin.unarchive:
    src: "https://github.com/smallstep/cli/releases/download/v{{ step_cli_version }}/step_linux_{{ step_cli_version }}_{{ step_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/step_{{ step_cli_version }}"

- name: Put step on the path
  ansible.builtin.copy:
    src: "/tmp/step_{{ step_cli_version }}/bin/step"
    dest: /usr/local/bin/step
    remote_src: true
    owner: root
    group: root
    mode: "0755"
