# Example inventory. The lab generates a real one — `make inventory` in lab/
# writes inventory.ini from live state, and that file is gitignored.
#
# Group names carry meaning:
#
#   identity   the identity provider. Deliberately not a directory client of
#              itself; site.yml excludes it from that play. The group is named
#              `identity` rather than `idp` because the host is called idp, and
#              a group sharing a host's name is ambiguous to Ansible — it warns,
#              and which one a reference resolves to is not worth guessing.
#   servers    directory clients, certificate SSH
#   desktops   the same, plus the endpoint baseline
#
# Every host is in `all`, and the break-glass role runs against `all` first.
# That ordering is a safety property, not a preference — see site.yml.

[identity]
idp ansible_host=192.0.2.10

# The certificate authority. Its own group so that moving it off the identity
# provider later is an inventory change rather than a rewrite; in a small
# estate the same machine does both.
[ca:children]
identity

[servers]
server-a ansible_host=192.0.2.20
server-b ansible_host=192.0.2.21

[desktops]
desktop ansible_host=192.0.2.30

[all:vars]
ansible_user=labadmin
ansible_python_interpreter=/usr/bin/python3
