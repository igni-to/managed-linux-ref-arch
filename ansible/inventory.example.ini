# Example inventory. The lab generates a real one — `make inventory` in lab/
# writes inventory.ini from live state, and that file is gitignored.
#
# Group names carry meaning:
#
#   idp        the identity provider. Deliberately not a directory client of
#              itself; site.yml excludes it from that play.
#   servers    directory clients, certificate SSH
#   desktops   the same, plus the endpoint baseline
#
# Every host is in `all`, and the break-glass role runs against `all` first.
# That ordering is a safety property, not a preference — see site.yml.

[idp]
idp ansible_host=192.0.2.10

[servers]
server-a ansible_host=192.0.2.20
server-b ansible_host=192.0.2.21

[desktops]
desktop ansible_host=192.0.2.30

[all:vars]
ansible_user=labadmin
ansible_python_interpreter=/usr/bin/python3
