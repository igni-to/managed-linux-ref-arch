[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = yaml
display_skipped_hosts = False
# Facts are gathered per play rather than cached: the estate is small and a
# stale fact about which distribution a host runs is a bug that takes an hour
# to find.
gathering = smart
retry_files_enabled = False

[ssh_connection]
pipelining = True
# The lab reaches everything except the gateway through a proxy jump, and the
# inventory carries that. ControlMaster keeps it from opening a new tunnel per
# task.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
