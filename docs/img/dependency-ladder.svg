<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Six layers stacked from the hypervisor console at the bottom to device and evidence at the top. Every dependency arrow points downward. A break-glass path runs from an operator at a console directly to Layer 0, bypassing every layer above it. An upward edge from Layer 0 to the identity provider is drawn crossed out and labeled never federated.">
  <title>The dependency ladder</title>
  <desc>Nothing may depend on a layer above it. Break-glass reaches Layer 0 without traversing the layers that may be broken.</desc>

  <!-- This figure carries its own ground so that it reads identically in a
       light or a dark reader. Palette is the Igni working-color set: manila
       stock, ink strokes, and color used only where it means something. -->
  <rect x="0" y="0" width="880" height="500" fill="#efe8db"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b5348"/>
    </marker>
    <marker id="ar-em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0330d"/>
    </marker>
    <marker id="ar-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#6b6052">THE DEPENDENCY LADDER</text>

    <!-- Layer 5 -->
    <rect x="228" y="52" width="430" height="52" rx="3" fill="#ffffff" stroke="#8a7a63" stroke-width="1.5"/>
    <text x="246" y="74" font-size="14" font-weight="600" fill="#221e1a">Device, configuration, evidence</text>
    <text x="246" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b5348">Fleet, Ansible, the evidence pack</text>
    <text x="216" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.8" fill="#6b6052" text-anchor="end">LAYER 5</text>

    <!-- Layer 4 -->
    <rect x="228" y="120" width="430" height="52" rx="3" fill="#ffffff" stroke="#8a7a63" stroke-width="1.5"/>
    <text x="246" y="142" font-size="14" font-weight="600" fill="#221e1a">Access</text>
    <text x="246" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b5348">SSH certificates, sudo, service sign-on</text>
    <text x="216" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.8" fill="#6b6052" text-anchor="end">LAYER 4</text>

    <!-- Layer 3 -->
    <rect x="228" y="188" width="430" height="52" rx="3" fill="#ffffff" stroke="#8a7a63" stroke-width="1.5"/>
    <text x="246" y="210" font-size="14" font-weight="600" fill="#221e1a">Identity</text>
    <text x="246" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b5348">The identity provider</text>
    <text x="216" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.8" fill="#6b6052" text-anchor="end">LAYER 3</text>

    <!-- Layer 2 -->
    <rect x="228" y="256" width="430" height="52" rx="3" fill="#ffffff" stroke="#8a7a63" stroke-width="1.5"/>
    <text x="246" y="278" font-size="14" font-weight="600" fill="#221e1a">Network</text>
    <text x="246" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b5348">The mesh</text>
    <text x="216" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.8" fill="#6b6052" text-anchor="end">LAYER 2</text>

    <!-- Layer 1 -->
    <rect x="228" y="324" width="430" height="52" rx="3" fill="#ffffff" stroke="#8a7a63" stroke-width="1.5"/>
    <text x="246" y="346" font-size="14" font-weight="600" fill="#221e1a">Secret store</text>
    <text x="246" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b5348">Holds the sealed break-glass credential</text>
    <text x="216" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.8" fill="#6b6052" text-anchor="end">LAYER 1</text>

    <!-- Layer 0 -->
    <rect x="228" y="392" width="430" height="52" rx="3" fill="#e7dfd0" stroke="#8a7a63" stroke-width="1.5"/>
    <text x="246" y="414" font-size="14" font-weight="600" fill="#221e1a">Hypervisor console, local realm</text>
    <text x="246" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b5348">Depends on nothing</text>
    <text x="216" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.8" fill="#6b6052" text-anchor="end">LAYER 0</text>

    <!-- Downward dependency rail -->
    <g stroke="#5b5348" stroke-width="1.5" fill="none">
      <path d="M 658 78 L 686 78 L 686 116" marker-end="url(#ar)"/>
      <path d="M 658 146 L 686 146 L 686 184" marker-end="url(#ar)"/>
      <path d="M 658 214 L 686 214 L 686 252" marker-end="url(#ar)"/>
      <path d="M 658 282 L 686 282 L 686 320" marker-end="url(#ar)"/>
      <path d="M 658 350 L 686 350 L 686 388" marker-end="url(#ar)"/>
    </g>
    <text x="704" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#6b6052" text-anchor="middle" transform="rotate(90 704 250)">DEPENDS ON</text>

    <!-- Forbidden upward edge: federating Layer 0 to the identity provider -->
    <path d="M 770 418 L 812 418 L 812 214 L 780 214" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ar-crit)"/>
    <g stroke="#b3261e" stroke-width="2.5">
      <line x1="802" y1="296" x2="822" y2="316"/>
      <line x1="822" y1="296" x2="802" y2="316"/>
    </g>
    <text x="812" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#b3261e" text-anchor="middle">never</text>
    <text x="812" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#b3261e" text-anchor="middle">federated</text>

    <!-- Break-glass: operator straight to Layer 0 -->
    <text x="104" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#b0330d" text-anchor="middle">operator</text>
    <text x="104" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#b0330d" text-anchor="middle">at a console</text>
    <path d="M 104 94 L 104 418 L 220 418" stroke="#b0330d" stroke-width="2" fill="none" marker-end="url(#ar-em)"/>
    <text x="120" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#b0330d" text-anchor="middle" transform="rotate(90 120 256)">break-glass, bypassing every layer above</text>

    <text x="20" y="480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5b5348">Nothing may depend on a layer above it.</text>
  </g>
</svg>
